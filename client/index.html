<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tower Stack</title>
    <meta name="theme-color" content="#1d9e75" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #0a1410;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        /* Prevent the browser turning the cursor into the text-selection
           i-beam while the player drags blocks around the canvas. */
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }
      #game-canvas {
        display: block; width: 100%; height: 100%;
        touch-action: none;
        cursor: default;
        outline: none;
      }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      /* HUD copy is still readable (selectable in dev tools) but won't
         flip the cursor while the held block sweeps over the tower. */
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
