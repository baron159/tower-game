[package]
name = "tower-stack"
version = "0.1.0"
description = "Tower Stack — card-driven dexterity stacking."
authors = ["Tower Stack contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tower_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
# Embeds the built web client so the binary works offline. Required for
# Steam/Itch release builds.
custom-protocol = ["tauri/custom-protocol"]
